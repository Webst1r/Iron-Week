<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Iron Week</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky plate-coloured week strip over a single working column; exercise cards pair an animated figure stage with a log card. */
:root {
  --bg: #E8EBEE; --surface: #FFFFFF; --surface2: #F2F4F6; --ink: #10161D; --muted: #55616F; --line: #D2D8DE;
  --accent: #1E56E6; --accent-ink: #FFFFFF; --ok: #15804B; --warn: #A86300; --bad: #C22C3E;
  --stage: #E3E8ED; --floor: #CBD3DB; --fig: #10161D; --fig-far: #8B97A4;
  --pr: #D7263D; --pb: #1E56E6; --py: #E6A700; --pg: #1B9A52; --ps: #8E9AA7; --pk: #2A323B;
  --tr: #FFFFFF; --tb: #FFFFFF; --ty: #1A1300; --tg: #FFFFFF; --ts: #10161D; --tk: #FFFFFF;
  --display: 'Big Shoulders Display', 'Oswald', 'Arial Narrow', Impact, sans-serif;
  --body: 'Barlow', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1216; --surface: #161C22; --surface2: #1D252D; --ink: #EEF1F4; --muted: #9BA7B4; --line: #28323C;
    --accent: #7AA0FF; --accent-ink: #0B1220; --ok: #3CCB86; --warn: #F2B544; --bad: #FF6B7D;
    --stage: #1D262F; --floor: #131A20; --fig: #EEF1F4; --fig-far: #6A7784;
    --pr: #FF5468; --pb: #6C94FF; --py: #FFC531; --pg: #3CCB86; --ps: #A9B4C0; --pk: #C9D2DB;
    --tr: #0B1016; --tb: #0B1016; --ty: #0B1016; --tg: #0B1016; --ts: #0B1016; --tk: #0B1016;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1216; --surface: #161C22; --surface2: #1D252D; --ink: #EEF1F4; --muted: #9BA7B4; --line: #28323C;
  --accent: #7AA0FF; --accent-ink: #0B1220; --ok: #3CCB86; --warn: #F2B544; --bad: #FF6B7D;
  --stage: #1D262F; --floor: #131A20; --fig: #EEF1F4; --fig-far: #6A7784;
  --pr: #FF5468; --pb: #6C94FF; --py: #FFC531; --pg: #3CCB86; --ps: #A9B4C0; --pk: #C9D2DB;
  --tr: #0B1016; --tb: #0B1016; --ty: #0B1016; --tg: #0B1016; --ts: #0B1016; --tk: #0B1016;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px; -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 800; letter-spacing: 0.01em; line-height: 1.05; margin: 0; text-wrap: balance; }
p { margin: 0; }
.wrap { max-width: 980px; margin: 0 auto; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 12px 0; border-bottom: 1px solid var(--line); }
.brandrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-size: 30px; text-transform: uppercase; letter-spacing: 0.03em; }
.brand small { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.tabs { display: flex; overflow-x: auto; gap: 2px; margin-top: 10px; scrollbar-width: none; scroll-snap-type: x proximity; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; padding: 12px 2px 10px; font-family: var(--display); font-weight: 700; font-size: clamp(13.5px, 3.9vw, 18px); letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); border-bottom: 4px solid transparent; min-width: 0; flex: 1 0 auto; padding-left: 12px; padding-right: 12px; white-space: nowrap; scroll-snap-align: center; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { padding-block: 20px 24px; display: grid; gap: 20px; }
.panel[hidden] { display: none !important; }

/* stat strip */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.stat b { display: block; font-family: var(--display); font-size: 34px; font-weight: 800; line-height: 1; }
.stat span { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* controls */
.controls { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .controls { grid-template-columns: 1.2fr 1fr; } }
.field-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 9px 6px; font-weight: 600; font-size: 14.5px; min-width: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.note { font-size: 14.5px; color: var(--muted); margin-top: 8px; }

/* week strip of plates */
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dayb { background: none; border: 0; padding: 4px 0; display: grid; justify-items: center; gap: 6px; min-width: 0; }
.plate { width: 100%; max-width: 54px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; position: relative; font-family: var(--display); font-weight: 800; font-size: 22px; background: var(--c); color: var(--t); box-shadow: inset 0 0 0 4px rgba(0,0,0,.14), inset 0 0 0 5px rgba(255,255,255,.18); }
.plate.restday { background: transparent; color: var(--muted); box-shadow: none; border: 2px dashed var(--line); }
.plate .tick { position: absolute; right: -2px; top: -2px; width: 19px; height: 19px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; border: 2px solid var(--bg); }
.dayb[aria-pressed="true"] .plate { outline: 3px solid var(--ink); outline-offset: 3px; }
.dayb .dn { font-family: var(--mono); font-size: 10px; letter-spacing: 0; text-transform: uppercase; color: var(--muted); line-height: 1.25; text-align: center; max-width: 100%; }
.dayb .dn i { display: block; font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dayb[aria-pressed="true"] .dn { color: var(--ink); font-weight: 700; }
.dayb .today { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; color: var(--accent); text-transform: uppercase; height: 12px; }

/* day header */
.dayhead { display: grid; gap: 10px; }
.dayhead h2 { font-size: clamp(38px, 9vw, 60px); text-transform: uppercase; }
.dayhead .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 15px; }
.chip { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; background: var(--surface); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.weekbanner { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.weekbanner b { font-family: var(--display); font-size: 22px; text-transform: uppercase; }

details.card, .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
details.card > summary { cursor: pointer; padding: 14px 16px; font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: 0.03em; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::after { content: "+"; font-family: var(--mono); font-size: 20px; color: var(--muted); }
details.card[open] > summary::after { content: "–"; }
.lines { padding: 0 16px 14px; display: grid; }
.lines > div { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-top: 1px solid var(--line); }
.lines > div span:first-child { font-weight: 600; }
.lines > div span:last-child { color: var(--muted); text-align: right; font-size: 15px; }
.extra { padding: 0 16px 14px; color: var(--muted); font-size: 15px; }

/* exercise card */
.exlist { display: grid; gap: 16px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; grid-template-columns: 1fr; }
@media (min-width: 760px) { .ex { grid-template-columns: minmax(0, 340px) minmax(0, 1fr); } }
.stage { position: relative; background: linear-gradient(to bottom, var(--stage) 0 92.5%, var(--floor) 92.5%); aspect-ratio: 200 / 156; width: 100%; max-height: 300px; border: 0; padding: 0; display: block; cursor: pointer; }
.stage svg { width: 100%; height: 100%; display: block; }
.stage .phase { position: absolute; left: 10px; top: 8px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.stage .hint { position: absolute; right: 10px; top: 8px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.stage .band { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--c); }
.fl { fill: none; stroke: var(--fig); stroke-linecap: round; stroke-linejoin: round; }
.fl.far { stroke: var(--fig-far); }
.fl.leg { stroke-width: 7; } .fl.arm { stroke-width: 5.5; } .fl.torso { stroke-width: 10; } .fl.neck { stroke-width: 5; }
.head { fill: var(--fig); }
.prop { fill: none; stroke: var(--c); stroke-width: 3; }
.prop.solid { fill: var(--c); stroke: none; }
.gear { fill: var(--ps); stroke: none; }
.gearline { stroke: var(--ps); stroke-width: 3; stroke-linecap: round; }
.exbody { padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.exname { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.exname h3 { font-size: 30px; text-transform: uppercase; }
.prescr { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1; white-space: nowrap; }
.prescr small { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-left: 4px; }
.equip { font-size: 14px; color: var(--muted); }
.sets { display: flex; flex-wrap: wrap; gap: 8px; }
.setbtn { min-width: 48px; height: 48px; padding: 0 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface2); font-family: var(--mono); font-size: 14px; font-weight: 600; display: grid; place-items: center; line-height: 1.1; }
.setbtn[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--t); }
.setbtn small { display: block; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; opacity: .75; font-weight: 500; }
.how { border-top: 1px solid var(--line); padding-top: 10px; }
.how summary { cursor: pointer; font-weight: 700; font-size: 15px; list-style: none; display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; }
.how summary::-webkit-details-marker { display: none; }
.how summary::after { content: "+"; font-family: var(--mono); color: var(--muted); }
.how[open] summary::after { content: "–"; }
.how ol { margin: 8px 0 0; padding-left: 22px; display: grid; gap: 6px; }
.how .cols { display: grid; gap: 10px; margin-top: 12px; }
@media (min-width: 520px) { .how .cols { grid-template-columns: 1fr 1fr; } }
.how h4 { font-size: 15px; font-family: var(--mono); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 4px; }
.how ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 15px; }
.how .bad li::marker { color: var(--bad); } .how .good li::marker { color: var(--ok); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 0; border-radius: 10px; padding: 14px 20px; font-weight: 700; font-size: 16px; background: var(--ink); color: var(--bg); min-height: 48px; }
.btn.accent { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.btn.sm { padding: 8px 14px; min-height: 40px; font-size: 14.5px; }
.progressline { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progressline i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .25s; }
.sumline { display: grid; gap: 8px; }
.sumline .row { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }

/* rest timer */
.rest { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); }
.rest[hidden] { display: none !important; }
.rest .in { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rest .t { font-family: var(--mono); font-size: 30px; font-weight: 600; min-width: 90px; }
.rest .lab { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; opacity: .7; }
.rest .bar { flex: 1; min-width: 80px; height: 6px; background: rgba(128,128,128,.4); border-radius: 9px; overflow: hidden; }
.rest .bar i { display: block; height: 100%; background: var(--py); width: 100%; }
.rest button { background: transparent; border: 1.5px solid currentColor; color: inherit; border-radius: 8px; padding: 6px 12px; font-weight: 600; font-size: 14px; min-height: 40px; }
.toast { position: fixed; left: 50%; bottom: calc(116px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 15px; z-index: 40; max-width: calc(100% - 32px); }
.toast[hidden] { display: none !important; }
.sheet { position: fixed; inset: 0; z-index: 50; background: rgba(8, 12, 16, .6); display: grid; place-items: end center; padding: 16px; }
.sheet[hidden] { display: none !important; }
.sheet .box { background: var(--surface); border-radius: 16px; padding: 20px; width: 100%; max-width: 520px; display: grid; gap: 14px; max-height: 90%; overflow: auto; }
.sheet h2 { font-size: 40px; text-transform: uppercase; }
.bigstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

/* plan table */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 14.5px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 8px; }
td button.link { background: none; border: 0; padding: 0; text-align: left; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.grid2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.card.pad { padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card.pad h3 { font-size: 26px; text-transform: uppercase; }
.rules { margin: 0; padding-left: 20px; display: grid; gap: 8px; }

/* progress */
.calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.calgrid .h { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: center; text-transform: uppercase; }
.cell { aspect-ratio: 1; border-radius: 6px; background: var(--surface2); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.cell.on { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 700; }
.cell.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.ring { width: 120px; height: 120px; flex: none; }
.ringrow { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.inputrow { display: flex; gap: 8px; flex-wrap: wrap; }
input[type=number], input[type=text], select { background: var(--surface2); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 44px; min-width: 0; width: 100%; }
.inputrow input { flex: 1; min-width: 100px; width: auto; }
.chartbox { width: 100%; }
.chartbox svg { width: 100%; height: auto; display: block; }
.axis { stroke: var(--line); stroke-width: 1; }
.axtxt { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
.ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.ar { fill: var(--accent); opacity: .12; }
.pt { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.empty { color: var(--muted); font-size: 15px; padding: 14px; border: 1.5px dashed var(--line); border-radius: 10px; text-align: center; }

/* fuel */
.form { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.form .full { grid-column: 1 / -1; }
.macro { display: grid; gap: 6px; }
.macrobar { display: flex; height: 16px; border-radius: 99px; overflow: hidden; }
.macrobar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 6px; }
.kcal { font-family: var(--display); font-size: 64px; font-weight: 800; line-height: 1; }
.glasses { display: flex; flex-wrap: wrap; gap: 6px; }
.glass { width: 38px; height: 46px; border-radius: 4px 4px 10px 10px; border: 2px solid var(--line); background: var(--surface2); padding: 0; }
.glass[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.meal { display: grid; grid-template-columns: 86px 1fr; gap: 6px 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.meal b { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding-top: 3px; }

/* guide */
.rpe { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.rpe div { height: 34px; border-radius: 5px; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 600; background: var(--c); color: #0B1016; }
.rpecap { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 6px; }
.disclaimer { font-size: 14px; color: var(--muted); border-left: 4px solid var(--warn); padding: 4px 0 4px 12px; }
footer { color: var(--muted); font-size: 13.5px; padding-block: 8px 24px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* v2: programs, library, loads */
select { appearance: auto; }
button:disabled { opacity: .4; cursor: default; }
.blockrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.blockrow .seg { flex: 1; min-width: 170px; }
.stepper { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.stepper b { font-family: var(--display); font-size: 20px; min-width: 78px; text-align: center; text-transform: uppercase; }
.stepper button { width: 38px; height: 38px; border: 0; border-radius: 7px; background: var(--surface2); font-size: 20px; font-weight: 700; }
.banner { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--ok); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
.banner b { font-family: var(--display); font-size: 22px; text-transform: uppercase; letter-spacing: .02em; }
.loadrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }

    '<div class="full"><label class="field-label" for="c-act">Activity outside the gym</label><select id="c-act">' + [[1.375, 'Desk job, little walking'], [1.55, 'On my feet some of the day'], [1.725, 'Physical job or very active']].map(function (o) { return '<option value="' + o[0] + '"' + (num(c.act) === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>' +
    '<div class="full"><label class="field-label" for="c-goal">Goal</label><select id="c-goal">' + [['cut', 'Lose fat, keep muscle'], ['maintain', 'Maintain and perform'], ['gain', 'Build muscle']].map(function (o) { return '<option value="' + o[0] + '"' + (c.goal === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div></div></div>' +
    '<div class="card pad" id="fuelout">' + fuelResult(c) + '</div></div>';
  h += '<div class="card pad"><h3>Simple food rules</h3><ol class="rules"><li><b>Protein at every meal.</b> A palm-sized portion of meat, fish, eggs, dairy, beans or tofu.</li><li><b>Carbs around training.</b> Rice, oats, potatoes and fruit fuel hard sessions.</li><li><b>Mostly whole foods.</b> Aim for about 80 percent of your food to be minimally processed.</li><li><b>Plan for the weekend.</b> Most progress is lost on Saturday night, not Monday morning.</li></ol></div>';
  h += '<p class="disclaimer">These figures come from the Mifflin-St Jeor equation and general sports-nutrition ranges. They are estimates, not medical advice. If you have a health condition, are pregnant or have a history of disordered eating, talk to a doctor or registered dietitian first.</p>';

}
function renderGuide() {
  var cols = ['#7BD389', '#7BD389', '#A6D96A', '#D9E35A', '#F2D04B', '#F5B544', '#F2933E', '#EC7048', '#E04B52', '#C62E40'];
  var h = '<div class="dayhead"><span class="eyebrow">Read once, use forever</span><h2>Guide</h2></div>';

    ['Gym or home', '<p>Flip the Gym and Home switch on the Train tab at any time. Home mode swaps machines and barbells for dumbbells, a loaded backpack, a chair and your bodyweight. Pull exercises use a table row or a door pull-up bar.</p><p>Tap <b>Swap exercise</b> on any card to pick a different version of the same movement, for example when a machine is taken.</p>'],
    ['Choosing and progressing weights', '<p>For your first set, pick a weight you could lift 2 or 3 more times. Enter it on the card. When you finish every set, the app suggests a small increase next time (2.5 kg on barbell lifts, 1 to 2 kg on dumbbells). If you missed reps, repeat the weight.</p><p>Bodyweight moves progress by slowing the lowering phase, pausing at the bottom or moving to a harder variation.</p>'],
    ['Warm-up sets', '<p>Before your first lift, do 8 reps at half weight, then 3 reps at about 75 percent. Later exercises need only one light set.</p>'],
    ['Missed a session?', '<p>Do not double up. Skip it, or fold the most important lifts into the next day. If you miss a full week, repeat the week you were on. Consistency over months beats any one perfect week.</p>'],
    ['Gym basics', '<ul><li>Wipe equipment down and re-rack your weights.</li><li>Ask before working in with someone, and do not stand at the rack between sets.</li><li>Use safety arms or a spotter for heavy bench and squat work.</li><li>Not sure how a machine works? Read the diagram on the frame or ask staff.</li></ul>'],
    ['Recovery and sleep', '<p>Muscle grows while you rest. Aim for 7 to 9 hours of sleep, drink water through the day and keep rest days easy. Mild soreness 24 to 48 hours after a session is normal. Sharp or joint pain is not.</p>'],
    ['Stay safe', '<ul><li>Warm up every time. It takes eight minutes and prevents most tweaks.</li><li>Stop a set when your form breaks, not when you are forced to.</li><li>Stop and see a doctor for chest pain, dizziness, numbness or sharp joint pain.</li></ul>']

  return h;
}

/* ---------- render shell ---------- */
var TABS = ['train', 'plan', 'library', 'progress', 'fuel', 'guide'];
function render() {
  renderHeader(); resetFigures();

  $$('.panel').forEach(function (p) { p.hidden = p.id !== 'p-' + S.tab; });
  var host = $('#p-' + S.tab);
  host.innerHTML = map[S.tab]();
  mountFigures(host);
}

/* ---------- timer ---------- */
var audio = null;
function beep() {
  if (!S.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.22, 0.44].forEach(function (t, k) {
      var o = audio.createOscillator(), g = audio.createGain();

      g.gain.setValueAtTime(0.0001, audio.currentTime + t); g.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + t + 0.18);
      o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.2);
    });

}
var timerId = null;
function startRest(sec, label) {
  S.timer = { end: Date.now() + sec * 1000, total: sec, label: label };
  $('#rest').hidden = false; $('#rlabel').textContent = 'Rest · ' + label; $('#rsound').textContent = S.sound ? 'Sound on' : 'Sound off'; tickRest();
  if (!timerId) timerId = setInterval(tickRest, 200);
}
function stopRest() { S.timer = null; $('#rest').hidden = true; if (timerId) { clearInterval(timerId); timerId = null; } }
function tickRest() {
  if (!S.timer) return;
  var left = Math.max(0, Math.ceil((S.timer.end - Date.now()) / 1000));
  $('#rtime').textContent = Math.floor(left / 60) + ':' + pad2(left % 60);
  $('#rbar').style.width = Math.max(0, (S.timer.end - Date.now()) / (S.timer.total * 1000) * 100) + '%';
  if (left <= 0) { beep(); stopRest(); toast('Rest over. Next set.'); }
}
var toastId = null;
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastId); toastId = setTimeout(function () { t.hidden = true; }, 2400); }

/* ---------- actions ---------- */
function updateProgress() {

  if (a) a.textContent = c.done + ' / ' + c.total;
  if (b) b.style.width = (c.total ? Math.round(c.done / c.total * 100) : 0) + '%';
}
function logToday(entry) {
  var t = iso(TODAY);
  S.log = S.log.filter(function (l) { return !(l.date === t && l.day === entry.day && l.week === entry.week && l.block === entry.block && l.prog === entry.prog); });
  entry.date = t; S.log.push(entry); persist();
}
function openSheet(html) { $('#sheetbody').innerHTML = html; $('#sheet').hidden = false; var f = $('#sheetbody [data-act]'); if (f) f.focus(); }
function finishWorkout() {
  var b = cur(), c = dayCounts(b), t = iso(TODAY), prs = [];
  if (!c.done) { toast('Tick at least one set first.'); return; }
  b.list.forEach(function (x, i) {
    if (!x.ex.load) return;
    var kg = num(S.inputs[wkey(i)]), n = 0, j;
    for (j = 0; j < x.sets; j++) if (S.checks[ckey(i, j)]) n++;
    if (!(kg > 0) || !n) return;
    var h = S.hist[x.id] = (S.hist[x.id] || []).filter(function (r) { return r.d !== t; }), prev = h.reduce(function (m, r) { return Math.max(m, r.kg); }, 0);
    h.push({ d: t, kg: Math.round(kg * 10) / 10, sets: n, tgt: x.sets, reps: x.unit === 'reps' ? x.val : 0 });
    h.sort(function (a, b2) { return a.d < b2.d ? -1 : 1; });
    if (prev > 0 && kg > prev) prs.push(x.ex.name + ' · ' + kgFmt(kg) + ' kg');
  });
  logToday({ day: S.day, prog: S.prog, block: S.block, week: S.week, level: S.level, place: S.place, sets: c.done, total: c.total, mins: b.mins });
  stopRest(); renderHeader();
  openSheet('<span class="eyebrow">' + b.day.label + ' · block ' + S.block + ' · week ' + S.week + '</span><h2>Session logged</h2>' +
    '<div class="bigstats"><div class="stat"><b>' + c.done + '/' + c.total + '</b><span>Sets</span></div><div class="stat"><b>~' + b.mins + '</b><span>Minutes</span></div><div class="stat"><b>' + streakNow() + '</b><span>Day streak</span></div></div>' +
    (prs.length ? '<div class="banner"><b>New personal best' + (prs.length > 1 ? 's' : '') + '</b><p>' + prs.map(esc).join('<br>') + '</p></div>' : '') +
    '<p>' + (c.done >= c.total ? 'Every set done. Eat well and sleep well tonight.' : 'Good work. Finish what you can, recover, and come back for the next one.') + '</p>' +
    '<div class="actions"><button class="btn accent" data-act="close-sheet">Back to plan</button></div>');
  render();
}
function openSwap(i) {
  var b = cur(), x = b.list[i], alts = alternatives(x.id);
  alts.sort(function (a, c) { var pa = (S.place === 'home' ? EX[a].home : !EX[a].home) ? 0 : 1, pc = (S.place === 'home' ? EX[c].home : !EX[c].home) ? 0 : 1; return pa - pc || (EX[a].name < EX[c].name ? -1 : 1); });
  openSheet('<span class="eyebrow">' + esc(x.slotName || '') + '</span><h2 style="font-size:34px">Swap ' + esc(x.ex.name) + '</h2><p class="note" style="margin:0">Same movement pattern, different tool. The swap lasts for this block.</p>' +
    '<div class="swaplist">' + alts.map(function (id) {
      var e = EX[id]; return '<button class="swapitem" data-act="pick" data-i="' + i + '" data-id="' + id + '"><span><b>' + esc(e.name) + '</b><span class="sub">' + esc(e.equip) + '</span></span><span class="chip tag ' + (e.home ? 'tag-home' : 'tag-gym') + '">' + (e.home ? 'Home' : 'Gym') + '</span></button>';
    }).join('') + '</div>' +
    '<div class="actions">' + (S.swaps[swapKey(i)] ? '<button class="btn ghost sm" data-act="unswap" data-i="' + i + '">Undo swap</button>' : '') + '<button class="btn ghost sm" data-act="close-sheet">Cancel</button></div>');
}
function go(tab) { if (location.hash.replace('#', '') === tab) { S.tab = tab; render(); } else location.hash = tab; }
function onClick(e) {
  var t = e.target.closest('[data-act]');
  if (!t) return;
  var a = t.getAttribute('data-act');

  if (a === 'day') { S.day = t.getAttribute('data-day'); render(); return; }
  if (a === 'open-day') { S.day = t.getAttribute('data-day'); go('train'); window.scrollTo(0, 0); return; }
  if (a === 'level') { S.level = t.getAttribute('data-v'); persist(); render(); return; }
  if (a === 'place') { S.place = t.getAttribute('data-v'); persist(); render(); return; }
  if (a === 'week') { S.week = parseInt(t.getAttribute('data-v'), 10); savePos(); persist(); render(); return; }
  if (a === 'block+') { S.block++; S.week = 1; savePos(); persist(); render(); return; }
  if (a === 'block-') { if (S.block > 1) { S.block--; S.week = 1; savePos(); persist(); render(); } return; }
  if (a === 'adv-week') { if (S.week < 4) S.week++; else { S.block++; S.week = 1; } savePos(); persist(); render(); window.scrollTo(0, 0); toast(S.week === 1 ? 'Block ' + S.block + ' started.' : 'Week ' + S.week + ' ready.'); return; }
  if (a === 'prog') { if (t.getAttribute('aria-disabled')) return; setProg(t.getAttribute('data-v')); S.confirm = ''; render(); window.scrollTo(0, 0); toast(P_().name + ' selected.'); return; }
  if (a === 'set') {
    var i = +t.getAttribute('data-i'), j = +t.getAttribute('data-j'), k = ckey(i, j), b = cur(), x = b.list[i];
    if (S.checks[k]) { delete S.checks[k]; t.setAttribute('aria-pressed', 'false'); }
    else {
      S.checks[k] = 1; t.setAttribute('aria-pressed', 'true');
      var c = dayCounts(b);

      else { stopRest(); toast('All sets done. Hit Finish workout.'); }
    }
    persist(); updateProgress(); return;
  }
  if (a === 'finish') { finishWorkout(); return; }
  if (a === 'clear-day') {
    var pre = baseKey() + '|';
    Object.keys(S.checks).forEach(function (kk) { if (kk.indexOf(pre) === 0) delete S.checks[kk]; });
    persist(); stopRest(); render(); return;
  }
  if (a === 'rest-done') { logToday({ day: S.day, prog: S.prog, block: S.block, week: S.week, level: S.level, place: S.place, sets: 0, rest: true }); toast('Recovery logged.'); render(); return; }
  if (a === 'close-sheet') { $('#sheet').hidden = true; return; }
  if (a === 'swap') { openSwap(+t.getAttribute('data-i')); return; }
  if (a === 'pick') { S.swaps[swapKey(+t.getAttribute('data-i'))] = t.getAttribute('data-id'); persist(); $('#sheet').hidden = true; render(); toast('Exercise swapped.'); return; }
  if (a === 'unswap') { delete S.swaps[swapKey(+t.getAttribute('data-i'))]; persist(); $('#sheet').hidden = true; render(); toast('Back to the plan.'); return; }
  if (a === 'rest-add') { if (S.timer) { S.timer.end += 15000; S.timer.total += 15; } return; }
  if (a === 'rest-skip') { stopRest(); return; }
  if (a === 'rest-sound') { S.sound = !S.sound; persist(); t.textContent = S.sound ? 'Sound on' : 'Sound off'; if (S.sound) beep(); return; }
  if (a === 'undo-weight') { S.weights.pop(); persist(); render(); return; }
  if (a === 'glass') {
    var n = +t.getAttribute('data-i') + 1, key = iso(TODAY);

  }
  if (a === 'new-cycle') {

  }

  }

  if (a === 'lib-env') { S.lib.env = t.getAttribute('data-v'); render(); return; }
  if (a === 'lib-open') {

  }

    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fail); else fail(); } catch (e2) { fail(); }
    return;
  }
  if (a === 'bk-restore') {
    try {
      var o = JSON.parse($('#bk-in').value);
      if (!o || typeof o !== 'object' || !PROGRAMS[o.prog || 'starter']) throw new Error('bad');
      SAVED_FIELDS.forEach(function (f) { if (o[f] != null) S[f] = o[f]; });
      S.log = (S.log || []).map(normLog); persist(); render(); toast('Backup restored.');
    } catch (e3) { toast('That text is not a valid backup.'); }
    return;
  }
}
function onSubmit(e) {
  if (e.target.id === 'wform') {
    e.preventDefault();
    var v = num($('#wkg').value);
    if (!(v >= 20 && v <= 400)) { toast('Enter a weight between 20 and 400 kg.'); return; }
    var t = iso(TODAY);
    S.weights = S.weights.filter(function (w) { return w.date !== t; }); S.weights.push({ date: t, kg: Math.round(v * 10) / 10 });

}
function onInput(e) {

  }

  if (id === 'lib-q') { if (e.type === 'input' && S.lib.q !== el.value) { S.lib.q = el.value; $('#liblist').innerHTML = libList(); } return; }
  if (id === 'sel-prog' && e.type === 'change') { setProg(el.value); render(); toast(P_().name + ' selected.'); return; }
  if (id === 'liftsel' && e.type === 'change') { S.lift = el.value; persist(); render(); return; }
}
function onToggle(e) {

  if (d.classList && d.classList.contains('libitem') && d.open) {
    var body = $('.libbody', d);
    if (!body.firstChild) body.innerHTML = libBody(d.getAttribute('data-id'));

  }
}
function onHash() {

  S.tab = TABS.indexOf(h) > -1 ? h : 'train';
  S.confirm = ''; render();
}
function toggleTheme() {
  S.theme = effectiveDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', S.theme); persist(); renderHeader();
}

/* ---------- boot ---------- */
function boot() {
  if (S.theme) document.documentElement.setAttribute('data-theme', S.theme);
  document.addEventListener('click', onClick); document.addEventListener('submit', onSubmit);
  document.addEventListener('input', onInput); document.addEventListener('change', onInput);
  document.addEventListener('toggle', onToggle, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#sheet').hidden) $('#sheet').hidden = true; });
  $('#themebtn').addEventListener('click', toggleTheme);
  $$('.tab').forEach(function (b) { b.addEventListener('click', function () { go(b.getAttribute('data-tab')); window.scrollTo(0, 0); }); });
  window.addEventListener('hashchange', onHash);
  onHash(); requestAnimationFrame(frameLoop);
}
boot();

</script>
